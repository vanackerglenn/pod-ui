# POD Go — per-model parameter spec (fill in from the device).
#
# For each module, list its parameters IN THE ORDER THEY APPEAR ON THE DEVICE
# screen. Each param is an inline table: { name = "...", kind = "..." }
#
# kind values:
#   percent   - 0..100%% (stored normalized 0..1) — the common case, fits a slider
#   db        - decibels (EQ gain, some levels/thresholds)
#   hz        - frequency in Hz
#   ms        - time in milliseconds
#   time      - tempo / note-division (e.g. "1/4", "1/8 dotted"); often the 1st param
#   semitones - pitch in semitones
#   enum      - discrete choice (wave shape, octave, # of heads, ...); add options = ["..",".."]
#   bool      - on/off switch
#   int       - integer count
#   unknown   - placeholder until you check
#
# Leave `params = []` for modules not done yet. Fill order matters — the device
# emits param VALUES positionally, so the Nth entry here maps to the Nth value.
# One example (Gray Flanger) is filled to show the format; verify its kinds too.


