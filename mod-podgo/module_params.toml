# POD Go — per-model parameter spec (fill in from the device).
#
# For each module, list its parameters IN THE ORDER THEY APPEAR ON THE DEVICE
# screen. Each param is an inline table: { name = "...", kind = "..." }
#
# `kind` names a reusable TYPE that carries the unit + display range, so common
# shapes don't have to be respelled per model. Just write `kind = "cents"`.
#
# BUILT-IN TYPES (defined in mod-podgo/src/model.rs `builtin_types`; ranges
# marked "est" are first-pass guesses to refine against the device):
#   percent   - %,  0..100, 0 dp   — the common case
#   percent1  -     0..10,  1 dp   — the "knob to 10" scale (shows e.g. 8.8)
#   mix       - %,  0..100, 0 dp
#   db/level  - dB, -60..12, 1 dp  (est)
#   hz/freq   - Hz, 20..20000, 0 dp (est)
#   ms        - ms, 0..1000, 0 dp  (est)
#   semitones - st, -24..24, 0 dp  (est)
#   cents     - ¢,  -50..50, 1 dp
#   pan       -     -100..100, 0 dp (Left/Center/Right labels: TODO)
#   int       -     0..10, 0 dp    (est)
#   lowcut    - Hz, 20..500,  "Off" at min  (est) — a Low Cut filter
#   highcut   - Hz, 500..20000, "Off" at max (est) — a High Cut filter
#   enum      - dropdown; REQUIRES options = ["..",".."]
#   bool      - on/off checkbox
#   unknown   - placeholder until you check
#
# INLINE OVERRIDES — any param may override its type's fields:
#   { name = "Pitch", kind = "semitones", min = -12, max = 12 }
#   { name = "Tone",  kind = "hz", min = 200, max = 8000 }
#   { name = "Gain",  kind = "db", decimals = 0 }
#   { name = "Filter", kind = "hz", off = "min" }   # off = "min" | "max"
# Supplying `options = [..]` makes a param a dropdown regardless of `kind`.
#
# CUSTOM TYPES — define your own (or tweak a built-in in ONE place) via [types]:
#   [types.ratio]      # a compressor-style discrete ratio
#   kind = "enum"
#   options = ["1.0:1", "1.5:1", "2.0:1", "4.0:1", "8:1", "Infinity:1"]
#
#   [types.lowcut]     # narrow the built-in estimate once you've checked it
#   max = 1000
#
# WIDGET RENDERING (current behavior — mod-podgo/src/module.rs):
#   bool                    -> checkbox
#   enum WITH options=[..]  -> dropdown of those labels
#   everything else         -> plain 0..127 slider
# The unit/min/max/decimals are RECORDED but not yet wired into the slider scale
# (that needs the normalized-value -> display mapping). Fill them anyway so it
# "just works" once that lands.
#
# NOTE-DIVISIONS ("1/4", "1/8 dotted", ...): on the wire these are a discrete
# int index, so model them as enum + options (a custom [types.<name>] is handy
# if several models share the same division list).
#
# Leave `params = []` for modules not done yet. Fill order matters — the device
# emits param VALUES positionally, so the Nth entry here maps to the Nth value.
#
# ---- REFERENCE: a made-up module exercising the kinds (commented out; not -----
# ---- parsed — copy/adapt the lines you need). enum REQUIRES options=[..]. ------
# [[module]]
# category = "Distortion"
# name = "Example All-Kinds"          # the name must match the device model name
# params = [
#   { name = "Drive",   kind = "percent" },                                  # 0..100%
#   { name = "Level",   kind = "db" },                                       # decibels
#   { name = "Tone",    kind = "hz", min = 200, max = 8000 },                # frequency w/ override
#   { name = "Attack",  kind = "ms" },                                       # milliseconds
#   { name = "Pitch",   kind = "semitones" },                                # pitch
#   { name = "Detune",  kind = "cents" },                                    # cents
#   { name = "Pan",     kind = "pan" },                                      # Left/Center/Right
#   { name = "Low Cut", kind = "lowcut" },                                   # "Off" at min
#   { name = "Wave",    kind = "enum", options = ["Sine", "Square", "Triangle"] },  # dropdown
#   { name = "Boost",   kind = "bool" },                                     # checkbox
# ]
#
# ============================================================================
# [types] — custom/override param types. Each inherits the built-in of the same
# name (if any), then applies the fields set here. Reference from a param with
# `kind = "<name>"`. Define shared enum lists once here instead of repeating
# their options on every param.
# ============================================================================

# The 12 chromatic notes, as the device labels them (harmonizer Key params).
[types.note]
kind = "enum"
options = ["A", "A Sharp", "B", "C", "C Sharp", "D", "D Sharp", "E", "F", "F Sharp", "G", "G Sharp"]

# Harmonizer scales (Twin Harmony, Dual Pitch V1/V2 ...).
[types.scale]
kind = "enum"
options = ["Major", "Minor", "Major Pentatonic", "Minor Pentatonic", "Harmonic Minor", "Melodic Minor", "Whole Tone", "Whole Diminished"]

# A plain unitless decimal value (multipliers like 0.0..2.0). Set min/max inline.
[types.number]
decimals = 1

# Harmonizer voice intervals (-9th..+9th, Unison center). NOTE: labels are
# RECONSTRUCTED, not yet device-verified — the device may say "Octave" for 8th,
# etc. Fix here once and both Shift params update.
[types.interval]
kind = "enum"
options = ["-9th", "-8th", "-7th", "-6th", "-5th", "-4th", "-3rd", "-2nd", "0", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th"]

# [types.example]
# kind = "enum"
# options = ["A", "B", "C"]


